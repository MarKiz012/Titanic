#   python main.py train --set model.name=rf --set cv.n_splits=10
#   python main.py train --set model.params.rf.n_estimators=1000

seed: 42

data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  target: Survived
  id_column: PassengerId

features:
  engineering: true # добавлять признаки Titanic (Title, FamilySize, Deck, ...)
  encoding: ordinal # ordinal — для деревьев, onehot — для линейных моделей
  scale: false # масштабировать числовые признаки


model:
  name: lgbm
  # Параметры по имени модели: берутся только для выбранной
  params:
    logreg: {}
    rf: {n_estimators: 500, min_samples_leaf: 2}
    histgb: {}
    lgbm: {n_estimators: 600, learning_rate: 0.05, num_leaves: 31}
    xgb: {}
    catboost: {}
    # Нейросеть: запускать с features.encoding=onehot и features.scale=true
    nn: {hidden_sizes: [64, 32], dropout: 0.2, lr: 0.001, epochs: 200, batch_size: 64}

cv:
  n_splits: 5
  shuffle: true

threshold: 0.5
output_dir: outputs
